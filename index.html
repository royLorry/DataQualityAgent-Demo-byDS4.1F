      <div class="crumb" id="crumb">工作台<em>Dashboard</em></div>

        <div class="avatar" title="业务人员">业</div>

    <h3 id="dw-title">详情</h3>
    <span class="mock-tag">MOCK</span>
    <button class="dw-x" id="dw-close" title="关闭">&#x2715;</button>
  </div>
  <div class="dw-body" id="dw-body"></div>
</aside>
